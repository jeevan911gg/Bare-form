      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getLocalDateKey(dateObj) {
        const d = dateObj instanceof Date ? dateObj : new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function parseLocalDateKey(dateKey) {
        if (typeof dateKey !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return null;
        const [y, m, d] = dateKey.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
        return dt;
      }

      function addDaysToDateKey(dateKey, deltaDays) {
        const dt = parseLocalDateKey(dateKey) || new Date();
        dt.setDate(dt.getDate() + deltaDays);
        return getLocalDateKey(dt);
      }

      function getWeekdayIndexFromDateKey(dateKey) {
        const dt = parseLocalDateKey(dateKey) || new Date();
        const jsDay = dt.getDay(); // 0=Sun..6=Sat
        return jsDay === 0 ? 6 : jsDay - 1; // 0=Mon..6=Sun
      }

      function formatFriendlyDate(dateKey) {
        const today = getLocalDateKey();
        const yesterday = addDaysToDateKey(today, -1);
        if (dateKey === today) return 'Today';
        if (dateKey === yesterday) return 'Yesterday';
        const dt = parseLocalDateKey(dateKey);
        if (!dt) return dateKey;
        return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      }

      function clampNumber(val, min, max, fallback) {
        const n = Number(val);

      // ============================================================

      const STORAGE_KEY_V2 = 'bareform90_state_v2';
      const STORAGE_KEY_V1 = 'bareform90_state_v1';
      const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      const DEFAULT_PROFILE = {

        experience: 'intermediate', // beginner | intermediate | advanced

      function createFreshState() {
        return {
          version: 2,
          activeTab: 'today',
          selectedScheduleDay: getWeekdayIndexFromDateKey(getLocalDateKey()),
          selectedFuelDate: getLocalDateKey(),
          profile: { ...DEFAULT_PROFILE },
          customSchedule: null, // array of 7 { dayIdx, focus } built from profile, editable by user
          programmeDays: [],    // [1..90] independent of calendar streak
          completedDates: {},   // { 'YYYY-MM-DD': { programmeDay, title, manual } }
          workoutHistory: [],   // chronological completed workout logs
          dailyLogs: {},        // { 'YYYY-MM-DD': { date, waterMl, meals: [] } }
          activeWorkoutDraft: { // in-progress session state keyed by date + dayIdx
            date: getLocalDateKey(),
            dayIdx: null,
            paused: false,
            startedAt: null,
            elapsedSec: 0,
            sets: {}            // { 'exId-setNum': { done: bool, reps: number } }
          },
          swappedExercises: {}, // { 'dayIdx-slotIdx': 'exId' }
          progressionState: {}, // { 'exId': { goodCount: number, repBonus: number, upgradedTo: null } }
          expandedExInfo: {},   // UI toggle for exercise details
          soundEnabled: true,
          storageAvailable: true
        };
      }

      let state = createFreshState();
      let restTimer = { seconds: 60, defaultSeconds: 60, running: false, intervalId: null };
      let progressChartInstance = null;

      function getRecommendedSplitForFrequency(days) {
        const d = Number(days) || 4;
        if (d <= 3) return 'full_body';
        if (d === 4) return 'upper_lower';
        if (d === 5) return 'hybrid';
        return 'ppl';
      }

      function evaluateSplitAdvice(sessionsPerWeek, format) {
        const d = Number(sessionsPerWeek) || 4;
        if (format === 'ppl' && d <= 2) {
          return { level: 'warn', text: 'PPL on 2 days/week leaves a major movement pattern untrained each week. Full Body is strongly recommended for 2 days/week.' };
        }
        if (format === 'ppl' && d === 4) {
          return { level: 'info', text: 'PPL on 4 days/week rotates unevenly across weeks. Upper / Lower gives more balanced weekly recovery.' };
        }
        if (format === 'full_body' && d >= 5) {
          return { level: 'warn', text: `Full Body on ${d} days/week trains the same muscles on consecutive days with limited recovery. Consider Upper / Lower, Hybrid, or PPL.` };
        }
        if (format === 'upper_lower' && d === 2) {
          return { level: 'info', text: 'Upper / Lower on 2 days/week hits each region once weekly. Full Body A/B trains every major muscle twice per week.' };
        }
        if (format === 'upper_lower' && d === 6) {
          return { level: 'info', text: 'Upper / Lower on 6 days/week is high frequency — keep intensity moderate or switch to PPL × 2 for better recovery.' };
        }
        return { level: 'ok', text: `Great match: ${getFormatLabel(format)} balances muscle coverage and recovery well for ${d} days/week.` };
      }

      function generateDefaultScheduleSlots(sessionsPerWeek, format) {
        const d = clampNumber(sessionsPerWeek, 2, 6, 4);
        const activeDayMap = {
          2: [0, 3],
          3: [0, 2, 4],
          4: [0, 1, 3, 4],
          5: [0, 1, 2, 4, 5],
          6: [0, 1, 2, 3, 4, 5]
        };
        const activeDays = activeDayMap[d] || activeDayMap[4];

        const patternSequences = {
          full_body: ['full_a', 'full_b', 'full_c', 'full_a', 'full_b', 'full_c'],
          upper_lower: d === 5
            ? ['upper', 'lower', 'conditioning', 'upper', 'lower']
            : ['upper', 'lower', 'upper', 'lower', 'upper', 'lower'],
          ppl: ['push', 'pull', 'legs', 'push', 'pull', 'legs'],
          hybrid: d === 2
            ? ['full_a', 'full_b']
            : d === 3
              ? ['upper', 'lower', 'conditioning']
              : d === 4
                ? ['upper', 'lower', 'push', 'pull']
                : d === 5
                  ? ['upper', 'lower', 'conditioning', 'upper', 'lower']
                  : ['push', 'pull', 'legs', 'upper', 'lower', 'conditioning']
        };

        const seq = patternSequences[format] || patternSequences.upper_lower;
        let ptr = 0;
        return DAY_NAMES.map((_, idx) => {
          if (!activeDays.includes(idx)) return { dayIdx: idx, focus: 'rest' };
          const focus = seq[ptr % seq.length];
          ptr++;
          return { dayIdx: idx, focus };
        });
      }

      function getDailyLog(dateKey) {
        const key = parseLocalDateKey(dateKey) ? dateKey : getLocalDateKey();
        if (!state.dailyLogs[key]) {
          state.dailyLogs[key] = { date: key, waterMl: 0, meals: [] };
        }
        return state.dailyLogs[key];
      }

      function migrateV1ToV2(v1) {
        const fresh = createFreshState();
        if (!v1 || typeof v1 !== 'object') return fresh;

        if (v1.profile && typeof v1.profile === 'object') {
          const oldInt = v1.profile.intensity;
          fresh.profile = {
            ...DEFAULT_PROFILE,
            gender: ['male', 'female', 'other'].includes(v1.profile.gender) ? v1.profile.gender : 'male',
            age: clampNumber(v1.profile.age, 13, 85, 22),
            weight: clampNumber(v1.profile.weight, 35, 200, 68),
            weightUnit: v1.profile.weightUnit === 'lbs' ? 'lbs' : 'kg',
            height: clampNumber(v1.profile.height, 130, 220, 174),
            goal: ['lose', 'athletic', 'muscle'].includes(v1.profile.goal) ? v1.profile.goal : 'athletic',
            equipment: ['bodyweight', 'pullup', 'dumbbells', 'both'].includes(v1.profile.equipment) ? v1.profile.equipment : 'bodyweight',
            sessionsPerWeek: clampNumber(v1.profile.sessionsPerWeek, 2, 6, 4),
            intensity: oldInt === 'beginner' ? 'low' : oldInt === 'intense' ? 'high' : 'moderate',
            experience: oldInt === 'beginner' ? 'beginner' : oldInt === 'intense' ? 'advanced' : 'intermediate',
            duration: [20, 30, 45, 60].includes(Number(v1.profile.duration)) ? Number(v1.profile.duration) : 45,
            format: ['full_body', 'upper_lower', 'ppl', 'hybrid'].includes(v1.profile.format) ? v1.profile.format : 'upper_lower',
            planBuilt: Boolean(v1.profile.planBuilt)
          };
        }

        fresh.customSchedule = generateDefaultScheduleSlots(fresh.profile.sessionsPerWeek, fresh.profile.format);

        // Migrate V1 completedDays into programmeDays safely
        if (Array.isArray(v1.completedDays)) {
          fresh.programmeDays = [...new Set(v1.completedDays.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 90))].sort((a, b) => a - b);
        }

        // Migrate V1 today water/meals into today's date-keyed dailyLog
        const today = getLocalDateKey();
        const water = clampNumber(v1.waterMl, 0, 8000, 0);
        const meals = Array.isArray(v1.meals)
          ? v1.meals.slice(0, 40).filter(m => m && typeof m.name === 'string').map(m => ({
              id: String(m.id || Date.now() + Math.random()),
              name: String(m.name).slice(0, 80),
              kcal: clampNumber(m.kcal, 0, 5000, 0),
              protein: clampNumber(m.protein, 0, 300, 0),
              time: ''
            }))
          : [];
        if (water > 0 || meals.length > 0) {
          fresh.dailyLogs[today] = { date: today, waterMl: water, meals };
        }

        if (typeof v1.soundEnabled === 'boolean') fresh.soundEnabled = v1.soundEnabled;
        return fresh;
      }

      function validateBackupPayload(raw) {
        if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
          return { ok: false, error: 'Backup file must be a valid JSON object.' };
        }
        if (raw.version !== 2 && !raw.profile) {
          return { ok: false, error: 'Unrecognized backup format. Expected a BareForm 90 backup.' };
        }
        if (raw.profile && typeof raw.profile !== 'object') {
          return { ok: false, error: 'Invalid profile data inside backup.' };
        }
        if (raw.programmeDays !== undefined && !Array.isArray(raw.programmeDays)) {
          return { ok: false, error: 'Invalid programmeDays field.' };
        }
        if (raw.completedDates !== undefined && (typeof raw.completedDates !== 'object' || Array.isArray(raw.completedDates))) {
          return { ok: false, error: 'Invalid completedDates field.' };
        }
        if (raw.dailyLogs !== undefined && (typeof raw.dailyLogs !== 'object' || Array.isArray(raw.dailyLogs))) {
          return { ok: false, error: 'Invalid dailyLogs field.' };
        }
        if (raw.workoutHistory !== undefined && !Array.isArray(raw.workoutHistory)) {
          return { ok: false, error: 'Invalid workoutHistory field.' };
        }

        // Sanitize & build clean V2 state
        const clean = createFreshState();
        const p = raw.profile || {};
        clean.profile = {
          gender: ['male', 'female', 'other'].includes(p.gender) ? p.gender : 'male',
          age: clampNumber(p.age, 13, 85, 22),
          weight: clampNumber(p.weight, 35, 200, 68),
          weightUnit: p.weightUnit === 'lbs' ? 'lbs' : 'kg',
          height: clampNumber(p.height, 130, 220, 174),
          experience: ['beginner', 'intermediate', 'advanced'].includes(p.experience) ? p.experience : 'intermediate',
          goal: ['lose', 'athletic', 'muscle'].includes(p.goal) ? p.goal : 'athletic',
          equipment: ['bodyweight', 'pullup', 'dumbbells', 'both'].includes(p.equipment) ? p.equipment : 'bodyweight',
          sessionsPerWeek: clampNumber(p.sessionsPerWeek, 2, 6, 4),
          intensity: ['low', 'moderate', 'high'].includes(p.intensity) ? p.intensity : 'moderate',
          duration: [20, 30, 45, 60].includes(Number(p.duration)) ? Number(p.duration) : 45,
          format: ['full_body', 'upper_lower', 'ppl', 'hybrid'].includes(p.format) ? p.format : 'upper_lower',
          hotWeather: Boolean(p.hotWeather),
          planBuilt: Boolean(p.planBuilt)
        };

        const validFocuses = ['rest', 'push', 'pull', 'legs', 'upper', 'lower', 'full_a', 'full_b', 'full_c', 'conditioning'];
        if (Array.isArray(raw.customSchedule) && raw.customSchedule.length === 7) {
          clean.customSchedule = raw.customSchedule.map((slot, idx) => ({
            dayIdx: idx,
            focus: slot && validFocuses.includes(slot.focus) ? slot.focus : 'rest'
          }));
        } else {
          clean.customSchedule = generateDefaultScheduleSlots(clean.profile.sessionsPerWeek, clean.profile.format);
        }

        if (Array.isArray(raw.programmeDays)) {
          clean.programmeDays = [...new Set(raw.programmeDays.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 90))].sort((a, b) => a - b);
        }

        if (raw.completedDates && typeof raw.completedDates === 'object') {
          for (const [k, v] of Object.entries(raw.completedDates)) {
            if (parseLocalDateKey(k) && v && typeof v === 'object') {
              clean.completedDates[k] = {
                programmeDay: clampNumber(v.programmeDay, 1, 90, 1),
                title: String(v.title || 'Workout').slice(0, 80),
                manual: Boolean(v.manual)
              };
            }
          }
        }

        if (raw.dailyLogs && typeof raw.dailyLogs === 'object') {
          for (const [k, v] of Object.entries(raw.dailyLogs)) {
            if (parseLocalDateKey(k) && v && typeof v === 'object') {
              const meals = Array.isArray(v.meals)
                ? v.meals.slice(0, 50).filter(m => m && typeof m.name === 'string').map(m => ({
                    id: String(m.id || Date.now() + Math.random()),
                    name: String(m.name).slice(0, 80),
                    kcal: clampNumber(m.kcal, 0, 5000, 0),
                    protein: clampNumber(m.protein, 0, 300, 0),
                    time: String(m.time || '').slice(0, 20)
                  }))
                : [];
              clean.dailyLogs[k] = {
                date: k,
                waterMl: clampNumber(v.waterMl, 0, 10000, 0),
                meals
              };
            }
          }
        }

        if (Array.isArray(raw.workoutHistory)) {
          clean.workoutHistory = raw.workoutHistory.slice(0, 200).filter(h => h && parseLocalDateKey(h.date)).map(h => ({
            id: String(h.id || Date.now() + Math.random()),
            date: h.date,
            title: String(h.title || 'Workout').slice(0, 80),
            short: String(h.short || 'Workout').slice(0, 30),
            programmeDay: clampNumber(h.programmeDay, 1, 90, 1),
            durationMin: clampNumber(h.durationMin, 5, 180, 30),
            effort: ['easy', 'good', 'hard'].includes(h.effort) ? h.effort : 'good',
            exercises: Array.isArray(h.exercises) ? h.exercises.slice(0, 20).map(ex => ({
              id: String(ex.id || ''),
              name: String(ex.name || '').slice(0, 80),
              setsCompleted: clampNumber(ex.setsCompleted, 0, 20, 0),
              targetSets: clampNumber(ex.targetSets, 1, 20, 3),
              maxReps: clampNumber(ex.maxReps, 0, 300, 0),
              timed: Boolean(ex.timed)
            })) : []
          }));
        }

        if (raw.swappedExercises && typeof raw.swappedExercises === 'object') {
          for (const [k, v] of Object.entries(raw.swappedExercises)) {
            if (typeof v === 'string' && EXERCISE_MAP[v]) clean.swappedExercises[k] = v;
          }
        }

        if (raw.progressionState && typeof raw.progressionState === 'object') {
          for (const [k, v] of Object.entries(raw.progressionState)) {
            if (EXERCISE_MAP[k] && v && typeof v === 'object') {
              clean.progressionState[k] = {
                goodCount: clampNumber(v.goodCount, 0, 100, 0),
                repBonus: clampNumber(v.repBonus, 0, 10, 0),
                readyToProgress: Boolean(v.readyToProgress)
              };
            }
          }
        }

        if (typeof raw.soundEnabled === 'boolean') clean.soundEnabled = raw.soundEnabled;
        return { ok: true, data: clean };
      }

      function loadState() {
        try {
          const testKey = '__bf90_test__';
          localStorage.setItem(testKey, '1');
          localStorage.removeItem(testKey);
          state.storageAvailable = true;
        } catch (e) {
          state.storageAvailable = false;
          state.customSchedule = generateDefaultScheduleSlots(state.profile.sessionsPerWeek, state.profile.format);
          const banner = document.getElementById('storage-warning');
          if (banner) banner.classList.remove('hidden');
          return;
        }

        try {
          const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (rawV2) {
            const parsed = JSON.parse(rawV2);
            const validated = validateBackupPayload(parsed);
            if (validated.ok) {
              state = validated.data;
              state.storageAvailable = true;
              return;
            }
          }
          // Try V1 migration
          const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
          if (rawV1) {
            const parsedV1 = JSON.parse(rawV1);
            state = migrateV1ToV2(parsedV1);
            state.storageAvailable = true;
            saveState();
            return;
          }
        } catch (e) {
          // Corrupted storage: fall back cleanly without crashing
        }
        state.customSchedule = generateDefaultScheduleSlots(state.profile.sessionsPerWeek, state.profile.format);
      }

      function saveState() {
        if (!state.storageAvailable) return;
        try {
          const payload = {
            version: 2,
            profile: state.profile,
            customSchedule: state.customSchedule,
            programmeDays: state.programmeDays,
            completedDates: state.completedDates,
            workoutHistory: state.workoutHistory,
            dailyLogs: state.dailyLogs,
            swappedExercises: state.swappedExercises,
            progressionState: state.progressionState,
            soundEnabled: state.soundEnabled
          };
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(payload));
        } catch (e) {
          // Ignore quota/storage errors
        }
      }

      // ============================================================
      // 4. WORKOUT ENGINE, SCHEDULE, & PROGRESSIVE OVERLOAD
      // ============================================================
      function getAllowedEquipment(equipKey) {
        if (equipKey === 'bodyweight') return ['bodyweight'];
        if (equipKey === 'pullup') return ['bodyweight', 'pullup'];
        if (equipKey === 'dumbbells') return ['bodyweight', 'dumbbells'];
        return ['bodyweight', 'pullup', 'dumbbells'];
      }

      function getEquipmentLabel(equipKey) {
        const map = {
          bodyweight: 'Zero Equipment (Bodyweight)',
          pullup: 'Bodyweight + Pull-Up Bar',
          dumbbells: 'Bodyweight + Dumbbells',
          both: 'Pull-Up Bar + Dumbbells'
        };
        return map[equipKey] || 'Zero Equipment';
      }

      function getFormatLabel(fmt) {
        const map = {
          full_body: 'Full Body',
          upper_lower: 'Upper / Lower',
          ppl: 'Push / Pull / Legs (PPL)',
          hybrid: 'Hybrid Athletic Split'
        };
        return map[fmt] || 'Upper / Lower';
      }

      const FOCUS_META = {
        rest: { short: 'Rest', title: 'Active Recovery & Mobility', warmupKey: 'full', patterns: [] },
        push: { short: 'Push', title: 'Push — Chest, Shoulders & Triceps', warmupKey: 'push', patterns: ['push', 'push', 'push', 'push', 'core'] },
        pull: { short: 'Pull', title: 'Pull — Back, Lats & Biceps', warmupKey: 'pull', patterns: ['pull', 'pull', 'pull', 'pull', 'core'] },
        legs: { short: 'Legs', title: 'Legs — Quads, Glutes & Hamstrings', warmupKey: 'legs', patterns: ['squat', 'hinge', 'squat', 'hinge', 'core'] },
        upper: { short: 'Upper', title: 'Upper Body — Push & Pull Balance', warmupKey: 'upper', patterns: ['push', 'pull', 'push', 'pull', 'core'] },
        lower: { short: 'Lower', title: 'Lower Body — Squat, Hinge & Core', warmupKey: 'lower', patterns: ['squat', 'hinge', 'squat', 'hinge', 'core'] },
        full_a: { short: 'Full Body A', title: 'Full Body A — Strength Foundation', warmupKey: 'full', patterns: ['squat', 'push', 'pull', 'hinge', 'core'] },
        full_b: { short: 'Full Body B', title: 'Full Body B — Balanced Volume', warmupKey: 'full', patterns: ['hinge', 'pull', 'push', 'squat', 'core'] },
        full_c: { short: 'Full Body C', title: 'Full Body C — Athletic Power', warmupKey: 'full', patterns: ['squat', 'push', 'pull', 'conditioning', 'core'] },
        conditioning: { short: 'Conditioning', title: 'Core & Athletic Conditioning', warmupKey: 'conditioning', patterns: ['conditioning', 'core', 'squat', 'push', 'core'] }
      };

      function pickExercisesForFocus(focus, count, p, dayIdx) {
        const meta = FOCUS_META[focus] || FOCUS_META.full_a;
        const allowed = getAllowedEquipment(p.equipment);
        const maxDiff = p.experience === 'beginner' ? 1 : p.experience === 'intermediate' ? 2 : 3;
        const chosen = [];
        const usedIds = new Set();

        for (let i = 0; i < count; i++) {
          const pattern = meta.patterns[i % meta.patterns.length];
          let pool = EXERCISES.filter(e => e.pattern === pattern && allowed.includes(e.equip) && e.difficulty <= maxDiff && !usedIds.has(e.id));
          if (pool.length === 0) {
            pool = EXERCISES.filter(e => e.pattern === pattern && allowed.includes(e.equip) && !usedIds.has(e.id));
          }
          if (pool.length === 0) continue;

          // Prioritize optional gear when selected so plan genuinely reflects kit
          const gearPool = pool.filter(e => e.equip !== 'bodyweight');
          const activePool = (gearPool.length > 0 && (i % 2 === 0 || p.equipment === 'both')) ? gearPool : pool;

          activePool.sort((a, b) => p.experience === 'advanced' ? b.difficulty - a.difficulty : a.difficulty - b.difficulty);
          const pick = activePool[(dayIdx + i) % activePool.length];
          usedIds.add(pick.id);
          chosen.push(pick);
        }
        return chosen;
      }

      function buildWeeklyPlan() {
        const p = state.profile;
        if (!Array.isArray(state.customSchedule) || state.customSchedule.length !== 7) {
          state.customSchedule = generateDefaultScheduleSlots(p.sessionsPerWeek, p.format);
        }

        const exCount = p.duration <= 20 ? 4 : p.duration <= 30 ? 5 : p.duration <= 45 ? 6 : 7;
        const baseSets = p.intensity === 'low' ? 3 : p.intensity === 'moderate' ? 3 : 4;
        const restMod = p.intensity === 'low' ? 15 : p.intensity === 'high' ? -10 : 0;
        const allowed = getAllowedEquipment(p.equipment);

        return state.customSchedule.map((slot, idx) => {
          const focus = slot.focus || 'rest';
          const meta = FOCUS_META[focus] || FOCUS_META.rest;
          if (focus === 'rest') {
            return {
              dayIdx: idx,
              dayShort: DAY_NAMES[idx],
              dayFull: DAY_FULL[idx],
              focus: 'rest',
              isRest: true,
              short: 'Rest',
              title: meta.title,
              duration: 15,
              exercises: [],
              warmup: [],
              recoveryNotes: [
                '10–20 min easy walk or gentle joint mobility flow',
                'Stay hydrated and eat balanced, protein-rich meals to rebuild muscle',
                'Aim for 7–9 hours of quality sleep — growth happens during recovery'
              ]
            };
          }

          const picked = pickExercisesForFocus(focus, exCount, p, idx);
          const exercises = picked.map((ex, slotIdx) => {
            const swapKey = `${idx}-${slotIdx}`;
            const swappedId = state.swappedExercises[swapKey];
            let finalEx = ex;
            if (swappedId && EXERCISE_MAP[swappedId] && allowed.includes(EXERCISE_MAP[swappedId].equip)) {
              finalEx = EXERCISE_MAP[swappedId];
            }

            const prog = state.progressionState[finalEx.id] || { goodCount: 0, repBonus: 0, readyToProgress: false };
            const repBonus = prog.repBonus || 0;
            const repMin = finalEx.repMin + repBonus;
            const repMax = finalEx.repMax + repBonus;
            const targetText = finalEx.timed ? `${repMin}–${repMax}s` : `${repMin}–${repMax}`;

            return {
              ...finalEx,
              slotIdx,
              sets: baseSets,
              repMin,
              repMax,
              targetText,
              restSec: Math.max(30, finalEx.restSec + restMod),
              readyToProgress: Boolean(prog.readyToProgress)
            };
          });

          return {
            dayIdx: idx,
            dayShort: DAY_NAMES[idx],
            dayFull: DAY_FULL[idx],
            focus,
            isRest: false,
            short: meta.short,
            title: meta.title,
            duration: Number(p.duration) || 45,
            exercises,
            warmup: WARMUPS[meta.warmupKey] || WARMUPS.full
          };
        });
      }

      // ============================================================
      // 5. CALENDAR STREAK & PROGRAMME PROGRESS ENGINE (Rest-Day Aware)
      // ============================================================
      function computeProgressAndStreak(plan) {
        const todayKey = getLocalDateKey();
        const completedDateKeys = Object.keys(state.completedDates).filter(k => parseLocalDateKey(k)).sort();
        const totalWorkouts = completedDateKeys.length;
        const completedToday = Boolean(state.completedDates[todayKey]);

        const progSorted = [...new Set(state.programmeDays)].filter(d => d >= 1 && d <= 90).sort((a, b) => a - b);
        const programmeCount = progSorted.length;
        const nextProgrammeDay = programmeCount >= 90 ? 90 : (progSorted.length === 0 ? 1 : Math.min(90, Math.max(...progSorted) + 1));

        const isRestWeekday = (dateKey) => {
          const wIdx = getWeekdayIndexFromDateKey(dateKey);
          return plan[wIdx] ? plan[wIdx].isRest : false;
        };

        // Current calendar streak: walk backward from today (or yesterday if today not yet done).
        // Scheduled rest days do NOT break the streak; missed training days DO break the streak.
        let currentStreak = 0;
        let cursor = completedToday ? todayKey : addDaysToDateKey(todayKey, -1);
        let safetySteps = 0;

        while (safetySteps < 365) {
          if (state.completedDates[cursor]) {
            currentStreak++;
            cursor = addDaysToDateKey(cursor, -1);
          } else if (isRestWeekday(cursor)) {
            // Only bridge across rest days if there is an earlier completed workout before it
            const hasEarlier = completedDateKeys.some(k => k < cursor);
            if (!hasEarlier) break;
            cursor = addDaysToDateKey(cursor, -1);
          } else {
            break;
          }
          safetySteps++;
        }

        // Longest streak across all recorded dates (rest-day aware)
        let longestStreak = currentStreak;
        if (completedDateKeys.length > 0) {
          let run = 1;
          for (let i = 1; i < completedDateKeys.length; i++) {
            const prevKey = completedDateKeys[i - 1];
            const currKey = completedDateKeys[i];
            let check = addDaysToDateKey(prevKey, 1);
            let bridged = true;
            let guard = 0;
            while (check < currKey && guard < 14) {
              if (!isRestWeekday(check)) { bridged = false; break; }
              check = addDaysToDateKey(check, 1);
              guard++;
            }
            if (check === currKey && bridged) run++;
            else run = 1;
            if (run > longestStreak) longestStreak = run;
          }
        }

        // Workouts this calendar week (Mon..Sun)
        const todayWeekday = getWeekdayIndexFromDateKey(todayKey);
        const weekStart = addDaysToDateKey(todayKey, -todayWeekday);
        const weekEnd = addDaysToDateKey(weekStart, 6);
        const thisWeekDone = completedDateKeys.filter(k => k >= weekStart && k <= weekEnd).length;
        const weeklyTarget = plan.filter(d => !d.isRest).length;

        return {
          todayKey,
          completedToday,
          totalWorkouts,
          programmeCount,
          programmePct: Math.round((programmeCount / 90) * 100),
          nextProgrammeDay,
          currentStreak,
          longestStreak,
          thisWeekDone,
          weeklyTarget,
          completedDateKeys
        };
      }

      // ============================================================
      // 6. AGE-SAFE NUTRITION & SENSIBLE HYDRATION CALCULATOR
      // ============================================================
      function calculateNutritionAndHydration(p) {
        const age = clampNumber(p.age, 13, 85, 22);
        const w = clampNumber(p.weight, 35, 200, 68);
        const h = clampNumber(p.height, 130, 220, 174);
        const isYouth = age < 18;

        // Sensible hydration range (30–35 ml/kg + exercise + hot weather)
        const workoutBonus = p.duration >= 60 ? 550 : p.duration >= 45 ? 400 : 250;
        const heatBonus = p.hotWeather ? 350 : 0;
        const lowWaterMl = Math.round((w * 30 + workoutBonus * 0.7 + heatBonus) / 50) * 50;
        const highWaterMl = Math.round((w * 36 + workoutBonus + heatBonus) / 50) * 50;
        const guideWaterMl = Math.round((lowWaterMl + highWaterMl) / 2 / 50) * 50;

        const hydration = {
          lowLiters: (lowWaterMl / 1000).toFixed(1),
          highLiters: (highWaterMl / 1000).toFixed(1),
          guideMl: guideWaterMl,
          guideLiters: (guideWaterMl / 1000).toFixed(1),
          glasses: Math.round(guideWaterMl / 250)
        };

        if (isYouth) {
          return {
            isYouth: true,
            hydration,
            calories: null
          };
        }

        // Adult Mifflin-St Jeor estimate (clearly presented as a range estimate, not medical advice)
        let bmr = 10 * w + 6.25 * h - 5 * age;
        if (p.gender === 'male') bmr += 5;
        else if (p.gender === 'female') bmr -= 161;
        else bmr -= 78;

        const sessions = clampNumber(p.sessionsPerWeek, 2, 6, 4);
        const mult = Math.min(1.8, 1.25 + sessions * 0.055 + (p.intensity === 'high' ? 0.1 : p.intensity === 'moderate' ? 0.05 : 0));
        const tdee = Math.round((bmr * mult) / 25) * 25;

        let target = tdee;
        let goalLabel = 'Maintenance Estimate';
        if (p.goal === 'lose') {
          target = Math.max(1450, tdee - 350);
          goalLabel = 'Gentle Deficit Estimate';
        } else if (p.goal === 'muscle') {
          target = tdee + 250;
          goalLabel = 'Modest Surplus Estimate';
        }

        const rangeLow = Math.max(1400, target - 100);
        const rangeHigh = target + 100;
        const proteinLow = Math.round(w * 1.4);
        const proteinHigh = Math.round(w * 1.9);

        return {
          isYouth: false,
          hydration,
          calories: {
            tdee,
            target,
            rangeLow,
            rangeHigh,
            proteinLow,
            proteinHigh,
            goalLabel
          }
        };
      }

      // ============================================================
      // 7. AUDIO, TOAST, & MODAL HELPERS
      // ============================================================
      function playBeep(freq, dur) {
        if (!state.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq || 880;
          gain.gain.setValueAtTime(0.07, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur || 0.16));
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + (dur || 0.16));
        } catch (e) {}
      }

      function celebrate() {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 70, spread: 65, origin: { y: 0.7 }, colors: ['#22C55E', '#F97316', '#38BDF8', '#FACC15'] });
        }
      }

      let toastTimer = null;
      function showToast(msg, isError) {
        const el = document.getElementById('toast');
        const box = document.getElementById('toast-box');
        const msgEl = document.getElementById('toast-message');
        if (!el || !msgEl) return;
        msgEl.textContent = msg;
        if (box) {
          box.className = isError
            ? 'bg-slate-900 border border-rose-500/50 text-rose-200 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-sm font-medium'
            : 'bg-slate-900 border border-emerald-500/40 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-sm font-medium';
        }
        el.classList.remove('opacity-0', 'translate-y-2');
        el.classList.add('opacity-100', 'translate-y-0');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          el.classList.remove('opacity-100', 'translate-y-0');
        }, 2800);
      }

      function openModal(html, onAttach) {
        const backdrop = document.getElementById('modal-backdrop');
        const content = document.getElementById('modal-content');
        if (!backdrop || !content) return;
        content.innerHTML = html;
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        if (typeof onAttach === 'function') onAttach(content);
      }

      function closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        if (!backdrop) return;
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }

      // ============================================================
      // 8. REST TIMER ENGINE
      // ============================================================
      function stopRestTimer() {
        if (restTimer.intervalId) {
          clearInterval(restTimer.intervalId);
          restTimer.intervalId = null;
        }
        restTimer.running = false;
      }

      function startRestTimer(seconds) {
        stopRestTimer();
        if (typeof seconds === 'number') {
          restTimer.seconds = seconds;
          restTimer.defaultSeconds = seconds;
        }
        if (restTimer.seconds <= 0) restTimer.seconds = restTimer.defaultSeconds || 60;
        restTimer.running = true;
        updateTimerUI();
        restTimer.intervalId = setInterval(() => {
          if (state.activeWorkoutDraft.paused) return;
          restTimer.seconds -= 1;
          if (restTimer.seconds <= 0) {
            restTimer.seconds = 0;
            stopRestTimer();
            playBeep(1046, 0.25);
            showToast('Rest complete — ready for your next set!');
          }
          updateTimerUI();
        }, 1000);
      }

      function updateTimerUI() {
        const display = document.getElementById('rest-timer-display');
        const toggleBtn = document.getElementById('timer-toggle-btn');
        if (display) {
          const m = Math.floor(restTimer.seconds / 60);
          const s = restTimer.seconds % 60;
          display.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        if (toggleBtn) {
          toggleBtn.textContent = restTimer.running ? 'Pause' : 'Start';
        }
      }

      // ============================================================
      // 9. MODALS: EXERCISE SWAP, COMPLETION SUMMARY, SETTINGS, MANUAL DATE
      // ============================================================
      function openSwapModal(dayIdx, slotIdx, currentEx) {
        const allowed = getAllowedEquipment(state.profile.equipment);
        const compatible = EXERCISES.filter(e =>
          e.pattern === currentEx.pattern &&
          allowed.includes(e.equip) &&
          e.id !== currentEx.id
        );

        openModal(`
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="text-lg font-bold text-white">Swap Exercise</h3>

      function completeWorkoutSession(day, effort) {
        const plan = buildWeeklyPlan();
        const stats = computeProgressAndStreak(plan);
        const todayKey = stats.todayKey;

        // Prevent duplicate completion on same calendar date
        if (state.completedDates[todayKey]) {
          showToast('Workout already logged for today!', true);
          return false;
        }

        const nextProg = stats.nextProgrammeDay;
        if (!state.programmeDays.includes(nextProg)) {
          state.programmeDays.push(nextProg);
          state.programmeDays.sort((a, b) => a - b);
        }

        state.completedDates[todayKey] = {
          programmeDay: nextProg,
          title: day.title,
          manual: false
        };

        // Evaluate sets & update progressive overload state
        const exSummaries = [];
        const progressedNames = [];

        day.exercises.forEach(ex => {
          let setsCompleted = 0;
          let maxReps = 0;
          let hitTopRangeAllSets = true;

          for (let s = 1; s <= ex.sets; s++) {
            const entry = state.activeWorkoutDraft.sets[`${ex.id}-${s}`];
            if (entry && entry.done) {
              setsCompleted++;
              const r = Number(entry.reps) || ex.repMin;
              if (r > maxReps) maxReps = r;
              if (r < ex.repMax) hitTopRangeAllSets = false;
            } else {
              hitTopRangeAllSets = false;
            }
          }

          exSummaries.push({
            id: ex.id,
            name: ex.name,
            setsCompleted,
            targetSets: ex.sets,
            maxReps,
            timed: ex.timed
          });

          // Sensible progressive overload rule:
          // Must complete all target sets at or above top of rep range AND effort isn't 'hard'
          if (setsCompleted >= ex.sets && hitTopRangeAllSets && effort !== 'hard') {
            const cur = state.progressionState[ex.id] || { goodCount: 0, repBonus: 0, readyToProgress: false };
            cur.goodCount += (effort === 'easy' ? 2 : 1);
            if (cur.goodCount >= 2) {
              cur.readyToProgress = true;
              progressedNames.push(ex.name);
            }
            state.progressionState[ex.id] = cur;
          }
        });

        state.workoutHistory.unshift({
          id: String(Date.now()),
          date: todayKey,
          title: day.title,
          short: day.short,
          programmeDay: nextProg,
          durationMin: day.duration,
          effort,
          exercises: exSummaries
        });

        // Clear active draft sets
        state.activeWorkoutDraft = {
          date: todayKey,
          dayIdx: day.dayIdx,
          paused: false,
          startedAt: null,
          elapsedSec: 0,
          sets: {}
        };

        stopRestTimer();
        saveState();
        celebrate();
        playBeep(987, 0.25);

        const msg = progressedNames.length > 0
          ? `Day ${nextProg} complete! ${progressedNames.length} move(s) ready to progress.`
          : `Day ${nextProg} complete — streak updated!`;
        showToast(msg);
        return true;
      }

        `, (box) => {

          const exportBtn = box.querySelector('#export-json-btn');
          if (exportBtn) {
            exportBtn.addEventListener('click', () => {
              const payload = {
                version: 2,
                exportedAt: new Date().toISOString(),
                profile: state.profile,
                customSchedule: state.customSchedule,
                programmeDays: state.programmeDays,
                completedDates: state.completedDates,
                workoutHistory: state.workoutHistory,
                dailyLogs: state.dailyLogs,
                swappedExercises: state.swappedExercises,
                progressionState: state.progressionState,
                soundEnabled: state.soundEnabled
              };
              const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `bareform90-backup-${getLocalDateKey()}.json`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              URL.revokeObjectURL(url);
              showToast('Backup exported!');

          const importInput = box.querySelector('#import-json-input');

          if (importInput) {
            importInput.addEventListener('change', (e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                try {
                  const parsed = JSON.parse(String(reader.result || ''));
                  const res = validateBackupPayload(parsed);
                  if (!res.ok) {
                    if (statusMsg) {
                      statusMsg.textContent = res.error;
                      statusMsg.className = 'text-xs text-rose-400 block';
                    }
                    showToast(res.error, true);
                    return;
                  }
                  const avail = state.storageAvailable;
                  state = res.data;
                  state.storageAvailable = avail;
                  saveState();
                  closeModal();
                  showToast('Backup restored successfully!');
                  render();
                } catch (err) {
                  if (statusMsg) {
                    statusMsg.textContent = 'Invalid JSON file — import rejected.';
                    statusMsg.className = 'text-xs text-rose-400 block';
                  }
                  showToast('Invalid JSON file.', true);
                }
              };
              reader.readAsText(file);
            });
          }

          const soundBtn = box.querySelector('#settings-sound-btn');
          if (soundBtn) {
            soundBtn.addEventListener('click', () => {
              state.soundEnabled = !state.soundEnabled;
              saveState();
              openSettingsModal();
            });
          }

          const resetBtn = box.querySelector('#confirm-reset-all-btn');
          if (resetBtn) {
            resetBtn.addEventListener('click', () => {
              state.programmeDays = [];
              state.completedDates = {};
              state.workoutHistory = [];
              state.dailyLogs = {};
              state.progressionState = {};
              state.activeWorkoutDraft.sets = {};
              saveState();
              closeModal();
              showToast('Progress cleared.');
              render();
            });
          }
        });
      }

      function renderWorkoutView(plan, stats) {
        let day = plan[state.selectedScheduleDay];
        if (!day || day.isRest) {
          const first = plan.find(d => !d.isRest);
          if (first) { state.selectedScheduleDay = first.dayIdx; day = first; }

        if (!day) {
          return `<div class="glass-card rounded-2xl p-6 text-center"><p class="text-slate-300">All days are currently set to Rest. Open Schedule to assign a training day.</p></div>`;

        // Reset draft if calendar date changed
        if (state.activeWorkoutDraft.date !== stats.todayKey) {
          state.activeWorkoutDraft = { date: stats.todayKey, dayIdx: day.dayIdx, paused: false, startedAt: null, elapsedSec: 0, sets: {} };

        let totalSets = 0;
        let doneSets = 0;
        day.exercises.forEach(ex => {

                          <div class="p-2 rounded-lg bg-slate-950/60 border border-slate-800"><span class="text-slate-400">Harder:</span> <span class="text-slate-200 font-semibold">${escapeHtml(ex.progression)}</span></div>

                        <div class="text-amber-300/90"><span class="font-bold">Safety:</span> ${escapeHtml(ex.safety)}</div>
                      </div>

                    <!-- Set-by-Set Tracker with Editable Reps/Seconds -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                      ${Array.from({ length: ex.sets }, (_, sIdx) => {
                        const setNum = sIdx + 1;
                        const key = `${ex.id}-${setNum}`;
                        const saved = state.activeWorkoutDraft.sets[key] || { done: false, reps: ex.repMax };
                        return `
                          <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 ${saved.done ? 'bg-emerald-500/15 border-emerald-500' : 'bg-slate-900/80 border-slate-800'}">

                              <div class="text-[10px] font-bold uppercase ${saved.done ? 'text-emerald-400' : 'text-slate-400'}">Set ${setNum}</div>

      function renderNutritionView(nut) {
        const dateKey = state.selectedFuelDate;
        const todayKey = getLocalDateKey();
        const log = getDailyLog(dateKey);
        const totalKcal = log.meals.reduce((s, m) => s + (Number(m.kcal) || 0), 0);
        const totalProtein = log.meals.reduce((s, m) => s + (Number(m.protein) || 0), 0);
        const waterPct = Math.min(100, Math.round((log.waterMl / Math.max(1, nut.hydration.guideMl)) * 100));

        // Recent dates with logs
        const recentLoggedDates = Object.keys(state.dailyLogs)
          .filter(k => (state.dailyLogs[k].waterMl > 0 || state.dailyLogs[k].meals.length > 0))
          .sort()
          .reverse()
          .slice(0, 7);

                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="droplets" class="w-5 h-5 text-sky-400"></i> Hydration Guide</h2>
                    <p class="text-xs text-slate-400">Suggested range: ~${nut.hydration.lowLiters}–${nut.hydration.highLiters} L/day (adjust to thirst &amp; sweat)</p>
                  </div>
                  <span class="text-2xl font-extrabold text-sky-400">${waterPct}%</span>

                      <div class="grid grid-cols-3 gap-1.5">
                        ${['low', 'moderate', 'high'].map(i => `
                          <button type="button" data-pick="intensity:${i}" class="py-2 rounded-xl border text-xs font-bold capitalize transition ${p.intensity === i ? 'bg-emerald-500/15 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-300'}">${i}</button>
                        `).join('')}
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-2">Session Duration</label>
                      <div class="grid grid-cols-4 gap-1.5">
                        ${[20, 30, 45, 60].map(m => `
                          <button type="button" data-pick="duration:${m}" class="py-2 rounded-xl border text-xs font-bold transition ${Number(p.duration) === m ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-300'}">${m}m</button>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Workout Split Format</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      ${[
                        { k: 'full_body', t: 'Full Body', s: 'Best for 2–3 days/week' },
                        { k: 'upper_lower', t: 'Upper / Lower', s: 'Best for 4 days/week' },
                        { k: 'hybrid', t: 'Hybrid Athletic', s: 'Best for 5 days/week (Upper/Lower + Conditioning)' },
                        { k: 'ppl', t: 'Push / Pull / Legs', s: 'Best for 6 days/week (or 3-day rotation)' }
                      ].map(o => `
                        <button type="button" data-pick="format:${o.k}" class="p-3 rounded-xl border text-left transition ${p.format === o.k ? 'bg-emerald-500/15 border-emerald-500 text-white' : 'bg-slate-900/75 border-slate-800 text-slate-300 hover:border-slate-600'}">
                          <div class="flex items-center justify-between gap-1">
                            <span class="text-sm font-bold">${o.t}</span>
                            ${recSplit === o.k ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">Best Match</span>' : ''}
                          </div>
                          <div class="text-[11px] text-slate-400 mt-0.5">${o.s}</div>
                        </button>
                      `).join('')}
                    </div>
                    <div class="mt-3 p-3 rounded-xl text-xs border ${
                      advice.level === 'warn'
                        ? 'bg-amber-500/10 border-amber-500/40 text-amber-200'
                        : advice.level === 'info'
                          ? 'bg-sky-500/10 border-sky-500/35 text-sky-200'
                          : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                    }">${escapeHtml(advice.text)}</div>
                  </div>
                </div>
              </div>

              <!-- Sticky Live Summary -->
              <div>
                <div class="glass-card rounded-2xl p-5 sticky top-20 space-y-4 border-emerald-500/30">
                  <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-400">Live Plan Summary</div>
                  <div class="space-y-2 text-xs">
                    <div class="flex justify-between py-1.5 border-b border-slate-800"><span class="text-slate-400">Split</span><span class="font-bold text-white">${escapeHtml(getFormatLabel(p.format))}</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-800"><span class="text-slate-400">Schedule</span><span class="font-bold text-white">${p.sessionsPerWeek}× / wk · ${p.duration} min</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-800"><span class="text-slate-400">Equipment</span><span class="font-bold text-emerald-400">${escapeHtml(getEquipmentLabel(p.equipment))}</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-800"><span class="text-slate-400">Water Guide</span><span class="font-bold text-sky-400">~${nut.hydration.lowLiters}–${nut.hydration.highLiters} L/day</span></div>
                    <div class="flex justify-between py-1.5">
                      <span class="text-slate-400">Nutrition</span>
                      <span class="font-bold text-white">${nut.isYouth ? 'Youth Growth Guide' : `~${nut.calories.rangeLow}–${nut.calories.rangeHigh} kcal`}</span>
                    </div>
                  </div>
                  <button id="generate-plan-btn" class="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm transition shadow-lg shadow-emerald-500/20">
                    Save &amp; Build My Plan
                  </button>
                  <p class="text-[11px] text-slate-500 text-center">Updating your plan preserves all completed workouts &amp; streak history.</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // ============================================================
      // 11. WEEKLY PROGRESS CHART (Chart.js, Real Data Only)
      // ============================================================
      function renderWeeklyChart(plan) {
        const canvas = document.getElementById('weekly-progress-chart');
        if (!canvas || typeof Chart !== 'function') return;
        if (progressChartInstance) {
          progressChartInstance.destroy();
          progressChartInstance = null;
        }

        const todayKey = getLocalDateKey();
        const todayW = getWeekdayIndexFromDateKey(todayKey);
        const currentWeekMon = addDaysToDateKey(todayKey, -todayW);
        const labels = [];
        const counts = [];
        const completedKeys = Object.keys(state.completedDates);

        for (let w = 5; w >= 0; w--) {
          const mon = addDaysToDateKey(currentWeekMon, -w * 7);
          const sun = addDaysToDateKey(mon, 6);
          const c = completedKeys.filter(k => k >= mon && k <= sun).length;
          labels.push(w === 0 ? 'This Wk' : `-${w}w`);
          counts.push(c);
        }

        progressChartInstance = new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'Workouts Completed',
              data: counts,
              backgroundColor: 'rgba(34, 197, 94, 0.75)',
              borderColor: '#22C55E',
              borderWidth: 1,
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: true,
                suggestedMax: Math.max(4, plan.filter(d => !d.isRest).length),
                ticks: { stepSize: 1, color: '#94A3B8', font: { size: 11 } },
                grid: { color: 'rgba(51,65,85,0.35)' }
              },
              x: {
                ticks: { color: '#94A3B8', font: { size: 11 } },
                grid: { display: false }
              }
            }
          }
        });
      }

      // ============================================================
      // 12. MASTER RENDER & LISTENER WIRING
      // ============================================================
      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;

        const plan = buildWeeklyPlan();
        const nut = calculateNutritionAndHydration(state.profile);
        const stats = computeProgressAndStreak(plan);

        const headerStreak = document.getElementById('header-streak-count');
        if (headerStreak) headerStreak.textContent = String(stats.currentStreak);

        document.querySelectorAll('.nav-tab').forEach(b => {
          const active = b.getAttribute('data-nav') === state.activeTab;
          b.classList.toggle('nav-btn-active', active);
          b.classList.toggle('text-slate-300', !active);
        });
        document.querySelectorAll('.mobile-nav-tab').forEach(b => {
          const active = b.getAttribute('data-nav') === state.activeTab;
          b.classList.toggle('mobile-nav-active', active);
          b.classList.toggle('text-slate-400', !active);
        });

        if (state.activeTab === 'today') root.innerHTML = renderTodayView(plan, nut, stats);
        else if (state.activeTab === 'workout') root.innerHTML = renderWorkoutView(plan, stats);
        else if (state.activeTab === 'schedule') root.innerHTML = renderScheduleView(plan);
        else if (state.activeTab === 'nutrition') root.innerHTML = renderNutritionView(nut);
        else if (state.activeTab === 'progress') root.innerHTML = renderProgressView(plan, stats);
        else if (state.activeTab === 'builder') root.innerHTML = renderBuilderView();

        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        if (state.activeTab === 'progress') renderWeeklyChart(plan);

        attachViewListeners(plan, stats);
      }

      function attachViewListeners(plan, stats) {
        const root = document.getElementById('app-root');
        if (!root) return;

        root.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', () => {
            const map = { 'go-workout': 'workout', 'go-builder': 'builder', 'go-schedule': 'schedule', 'go-nutrition': 'nutrition', 'go-progress': 'progress', 'go-today': 'today' };
            const target = map[btn.getAttribute('data-action')];
            if (target) {
              state.activeTab = target;
              window.scrollTo({ top: 0, behavior: 'smooth' });
              render();
            }
          });
        });

        root.querySelectorAll('[data-select-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedScheduleDay = Number(btn.getAttribute('data-select-day'));
            render();
          });
        });

        root.querySelectorAll('[data-launch-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedScheduleDay = Number(btn.getAttribute('data-launch-day'));
            state.activeTab = 'workout';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          });
        });

        // Today quick water
        root.querySelectorAll('[data-water-today]').forEach(btn => {
          btn.addEventListener('click', () => {
            const delta = Number(btn.getAttribute('data-water-today'));
            const log = getDailyLog(stats.todayKey);
            log.waterMl = clampNumber(log.waterMl + delta, 0, 10000, 0);
            saveState();
            playBeep(660, 0.1);
            showToast(`Added ${delta} ml water`);
            render();
          });
        });

        // Workout view controls
        const daySwitcher = document.getElementById('workout-day-switcher');
        if (daySwitcher) {
          daySwitcher.addEventListener('change', (e) => {
            state.selectedScheduleDay = Number(e.target.value);
            render();
          });
        }

        const pauseBtn = document.getElementById('pause-workout-btn');
        if (pauseBtn) {
          pauseBtn.addEventListener('click', () => {
            state.activeWorkoutDraft.paused = !state.activeWorkoutDraft.paused;
            showToast(state.activeWorkoutDraft.paused ? 'Workout paused' : 'Workout resumed');
            render();
          });
        }

        root.querySelectorAll('[data-toggle-info]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-toggle-info');
            state.expandedExInfo[id] = !state.expandedExInfo[id];
            render();
          });
        });

        root.querySelectorAll('[data-open-swap]').forEach(btn => {
          btn.addEventListener('click', () => {
            const [dIdx, sIdx, exId] = btn.getAttribute('data-open-swap').split(':');
            const ex = EXERCISE_MAP[exId];
            if (ex) openSwapModal(Number(dIdx), Number(sIdx), ex);
          });
        });

        root.querySelectorAll('[data-apply-progress]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.getAttribute('data-apply-progress');
            const cur = state.progressionState[exId] || { goodCount: 0, repBonus: 0, readyToProgress: false };
            cur.repBonus = Math.min(10, (cur.repBonus || 0) + 2);
            cur.goodCount = 0;
            cur.readyToProgress = false;
            state.progressionState[exId] = cur;
            saveState();
            showToast('Target progressed by +2!');
            render();
          });
        });

        root.querySelectorAll('[data-set-reps]').forEach(inp => {
          inp.addEventListener('change', (e) => {
            const key = inp.getAttribute('data-set-reps');
            const val = clampNumber(e.target.value, 1, 300, 10);
            const existing = state.activeWorkoutDraft.sets[key] || { done: false, reps: val };
            existing.reps = val;
            state.activeWorkoutDraft.sets[key] = existing;
          });
        });

        root.querySelectorAll('[data-toggle-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (state.activeWorkoutDraft.paused) return;
            const key = btn.getAttribute('data-toggle-set');
            const rest = Number(btn.getAttribute('data-rest')) || 60;
            const defReps = Number(btn.getAttribute('data-default-reps')) || 10;
            const cur = state.activeWorkoutDraft.sets[key] || { done: false, reps: defReps };
            cur.done = !cur.done;
            state.activeWorkoutDraft.sets[key] = cur;
            if (cur.done) {
              playBeep(784, 0.12);
              startRestTimer(rest);
            }
            render();
          });
        });

        const tToggle = document.getElementById('timer-toggle-btn');
        if (tToggle) {
          tToggle.addEventListener('click', () => {
            if (restTimer.running) { stopRestTimer(); updateTimerUI(); }
            else startRestTimer(restTimer.seconds || 60);
          });
        }
        const tMinus = document.getElementById('timer-minus-btn');
        if (tMinus) tMinus.addEventListener('click', () => { restTimer.seconds = Math.max(10, restTimer.seconds - 15); updateTimerUI(); });
        const tPlus = document.getElementById('timer-plus-btn');
        if (tPlus) tPlus.addEventListener('click', () => { restTimer.seconds = Math.min(300, restTimer.seconds + 15); updateTimerUI(); });
        const tReset = document.getElementById('timer-reset-btn');
        if (tReset) tReset.addEventListener('click', () => { stopRestTimer(); restTimer.seconds = restTimer.defaultSeconds || 60; updateTimerUI(); });
        const sndBtn = document.getElementById('sound-toggle-btn');
        if (sndBtn) sndBtn.addEventListener('click', () => { state.soundEnabled = !state.soundEnabled; saveState(); render(); });

        const completeModalBtn = document.getElementById('open-complete-modal-btn');
        if (completeModalBtn) {
          completeModalBtn.addEventListener('click', () => {
            const activeDay = plan[state.selectedScheduleDay];
            if (activeDay && !activeDay.isRest) openCompleteWorkoutModal(activeDay);
          });
        }

        // Schedule customization
        root.querySelectorAll('[data-change-day-focus]').forEach(sel => {
          sel.addEventListener('change', (e) => {
            const idx = Number(sel.getAttribute('data-change-day-focus'));
            state.customSchedule[idx] = { dayIdx: idx, focus: e.target.value };
            state.profile.sessionsPerWeek = Math.max(2, Math.min(6, state.customSchedule.filter(s => s.focus !== 'rest').length || 2));
            saveState();
            showToast(`${DAY_FULL[idx]} updated!`);
            render();
          });
        });

        const resetSchedBtn = document.getElementById('reset-schedule-defaults-btn');
        if (resetSchedBtn) {
          resetSchedBtn.addEventListener('click', () => {
            state.customSchedule = generateDefaultScheduleSlots(state.profile.sessionsPerWeek, state.profile.format);
            saveState();
            showToast('Schedule reset to split defaults.');
            render();
          });
        }

        // Fuel & Water view
        const prevFuel = document.getElementById('fuel-prev-day');
        if (prevFuel) prevFuel.addEventListener('click', () => { state.selectedFuelDate = addDaysToDateKey(state.selectedFuelDate, -1); render(); });
        const nextFuel = document.getElementById('fuel-next-day');
        if (nextFuel) nextFuel.addEventListener('click', () => {
          const nxt = addDaysToDateKey(state.selectedFuelDate, 1);
          if (nxt <= getLocalDateKey()) { state.selectedFuelDate = nxt; render(); }
        });

        root.querySelectorAll('[data-water-date]').forEach(btn => {
          btn.addEventListener('click', () => {
            const delta = Number(btn.getAttribute('data-water-date'));
            const log = getDailyLog(state.selectedFuelDate);
            log.waterMl = clampNumber(log.waterMl + delta, 0, 10000, 0);
            saveState();
            playBeep(delta > 0 ? 660 : 440, 0.1);
            render();
          });
        });

        const hotBtn = document.getElementById('toggle-hot-weather');
        if (hotBtn) {
          hotBtn.addEventListener('click', () => {
            state.profile.hotWeather = !state.profile.hotWeather;
            saveState();
            render();
          });
        }

        const mealForm = document.getElementById('meal-form');
        if (mealForm) {
          mealForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('meal-name-input').value.trim().slice(0, 80);
            const kcal = clampNumber(document.getElementById('meal-kcal-input').value, 0, 4000, 0);
            const protein = clampNumber(document.getElementById('meal-protein-input').value, 0, 250, 0);
            if (!name) return;
            const log = getDailyLog(state.selectedFuelDate);
            log.meals.unshift({ id: String(Date.now()), name, kcal, protein });
            saveState();
            showToast(`Logged ${name}`);
            render();
          });
        }

        root.querySelectorAll('[data-del-meal]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-del-meal');
            const log = getDailyLog(state.selectedFuelDate);
            log.meals = log.meals.filter(m => m.id !== id);
            saveState();
            render();
          });
        });

        root.querySelectorAll('[data-jump-fuel-date]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedFuelDate = btn.getAttribute('data-jump-fuel-date');
            render();
          });
        });

        // Progress view
        const manualBtn = document.getElementById('open-manual-date-btn');
        if (manualBtn) manualBtn.addEventListener('click', openManualDateModal);

        // Plan Builder inputs
        const bindSelect = (id, key) => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('change', (e) => { state.profile[key] = e.target.value; render(); });
        };
        bindSelect('b-gender', 'gender');
        bindSelect('b-experience', 'experience');
        bindSelect('b-goal', 'goal');

        const bAge = document.getElementById('b-age');
        if (bAge) {
          bAge.addEventListener('change', (e) => {
            state.profile.age = clampNumber(e.target.value, 13, 85, 22);
            if (state.profile.age < 18 && state.profile.goal === 'lose') state.profile.goal = 'athletic';
            render();
          });
        }
        const bHeight = document.getElementById('b-height');
        if (bHeight) bHeight.addEventListener('change', (e) => { state.profile.height = clampNumber(e.target.value, 130, 220, 174); render(); });
        const bWeight = document.getElementById('b-weight');
        if (bWeight) {
          bWeight.addEventListener('change', (e) => {
            const raw = Number(e.target.value) || 68;
            state.profile.weight = state.profile.weightUnit === 'lbs'
              ? clampNumber(Math.round(raw / 2.20462), 35, 200, 68)
              : clampNumber(raw, 35, 200, 68);
            render();
          });
        }
        root.querySelectorAll('[data-unit]').forEach(btn => {
          btn.addEventListener('click', () => { state.profile.weightUnit = btn.getAttribute('data-unit'); render(); });
        });
        root.querySelectorAll('[data-pick]').forEach(btn => {
          btn.addEventListener('click', () => {
            const [key, val] = btn.getAttribute('data-pick').split(':');
            state.profile[key] = (key === 'sessionsPerWeek' || key === 'duration') ? Number(val) : val;
            if (key === 'sessionsPerWeek') {
              state.profile.format = getRecommendedSplitForFrequency(state.profile.sessionsPerWeek);
            }
            if (key === 'equipment') state.swappedExercises = {};
            render();
          });
        });

        const genBtn = document.getElementById('generate-plan-btn');
        if (genBtn) {
          genBtn.addEventListener('click', () => {
            state.profile.planBuilt = true;
            state.customSchedule = generateDefaultScheduleSlots(state.profile.sessionsPerWeek, state.profile.format);
            saveState();
            celebrate();
            showToast('Custom 90-day plan built! History preserved.');
            state.activeTab = 'today';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          });
        }
      }

      // ============================================================
      // 13. BOOT & TEST HOOK
      // ============================================================
      function init() {
        loadState();
        state.selectedScheduleDay = getWeekdayIndexFromDateKey(getLocalDateKey());
        state.selectedFuelDate = getLocalDateKey();

        document.querySelectorAll('[data-nav]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.getAttribute('data-nav');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
          });
        });

        const builderBtn = document.getElementById('open-builder-btn');
        if (builderBtn) builderBtn.addEventListener('click', () => { state.activeTab = 'builder'; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); });

        const settingsBtn = document.getElementById('open-settings-btn');
        if (settingsBtn) settingsBtn.addEventListener('click', openSettingsModal);

        const backdrop = document.getElementById('modal-backdrop');
        if (backdrop) {
          backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
        }

        render();
      }

      // Expose read/test interface for automated verification
      window.__BAREFORM_V2__ = {
        getState: () => state,
        EXERCISES,
        escapeHtml,
        getLocalDateKey,
        addDaysToDateKey,
        buildWeeklyPlan,
        generateDefaultScheduleSlots,
        evaluateSplitAdvice,
        calculateNutritionAndHydration,
        computeProgressAndStreak,
        migrateV1ToV2,
        validateBackupPayload,
        completeWorkoutSession,
        getDailyLog
      };

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .catch((err) => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>
